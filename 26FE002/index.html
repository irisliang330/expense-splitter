<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>團體記帳分攤與債權結算系統</title>
    <style>
      :root {
        --primary: #4a90e2;
        --bg: #eef2f5;
        --card-bg: #fff;
        --border: #e2e8f0;
        --text: #2d3748;
        --muted: #718096;
        --success: #2ecc71;
        --warning: #f39c12;
        --danger: #e74c3c;
        --info-bg: #ebf4ff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .card {
        background: var(--card-bg);
        width: 100%;
        max-width: 650px;
        border-radius: 14px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        padding: 20px;
      }
      .card-header {
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
        margin-bottom: 16px;
      }
      .card-header h2,
      .card-header h3 {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
      }
      .card-accent-warning {
        border-top: 4px solid var(--warning);
      }
      .card-accent-success {
        border-top: 4px solid var(--success);
      }

      /* Form */
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 6px;
        color: #4a5568;
      }
      input[type="text"],
      input[type="number"],
      input[type="date"],
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
        background: #fff;
        color: var(--text);
        -webkit-appearance: none;
      }
      input:disabled {
        background: #f7fafc;
        color: var(--muted);
      }
      .radio-group {
        display: flex;
        gap: 8px;
      }
      .radio-box {
        flex: 1;
      }
      .radio-box input[type="radio"] {
        display: none;
      }
      .radio-box label {
        display: block;
        padding: 10px 6px;
        background: #f7fafc;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font-weight: 400;
        font-size: 13px;
        text-align: center;
        transition: all 0.2s;
      }
      .radio-box input[type="radio"]:checked + label {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        font-weight: 600;
      }
      .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn-toggle {
        flex: 1;
        min-width: 70px;
        padding: 10px 8px;
        border: 1px solid var(--border);
        background: #f7fafc;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-toggle.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        font-weight: 700;
      }

      /* 明細篩選付款人專屬綠色按鈕樣式 */
      .btn-toggle-filter {
        flex: 1;
        min-width: 65px;
        padding: 8px 6px;
        border: 1px solid var(--border);
        background: #f7fafc;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-toggle-filter.active {
        background: var(--success);
        color: #fff;
        border-color: var(--success);
        font-weight: 700;
      }

      /* 明細筆數切換按鈕樣式 */
      .btn-toggle-limit {
        padding: 6px 12px;
        border: 1px solid var(--border);
        background: #f7fafc;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-toggle-limit.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        font-weight: 700;
      }

      .members-section {
        background: #f7fafc;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 12px;
      }
      .member-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }
      .member-row:last-child {
        border-bottom: none;
      }
      .member-label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        flex: 1;
      }
      .member-label input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--primary);
        cursor: pointer;
      }
      .member-label span {
        font-size: 15px;
      }
      .amount-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .result-amount {
        font-weight: 700;
        color: var(--text);
        font-size: 15px;
        min-width: 40px;
        text-align: right;
      }
      .custom-amount-input {
        width: 120px;
        padding: 6px 8px;
        text-align: right;
        font-size: 14px;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: var(--success);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
        margin-bottom: 8px;
      }
      .submit-btn:hover {
        background: #27ae60;
      }
      .submit-btn:disabled {
        background: #a0aec0;
        cursor: not-allowed;
      }
      .cancel-btn {
        width: 100%;
        padding: 11px;
        background: #edf2f7;
        color: #4a5568;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .cancel-btn:hover {
        background: #e2e8f0;
      }

      /* Filter */
      .filter-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      /* Expense cards (replaces table) */
      .expense-cards {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 4px;
      }
      .expense-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        position: relative;
      }
      .expense-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 6px;
      }
      .expense-card-title {
        font-weight: 700;
        font-size: 15px;
        color: var(--text);
      }
      .expense-card-type {
        font-size: 11px;
        background: var(--info-bg);
        color: var(--primary);
        border-radius: 20px;
        padding: 2px 8px;
        font-weight: 600;
        white-space: nowrap;
      }
      .expense-card-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .expense-card-meta .payer {
        color: #3182ce;
        font-weight: 600;
      }
      .expense-card-amount {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
      }
      .expense-card-shares {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .share-tag {
        background: #f7fafc;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 12px;
      }
      .expense-card-actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .action-btn {
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 7px;
        border: none;
        cursor: pointer;
        color: #fff;
      }
      .edit-small-btn {
        background: var(--warning);
      }
      .edit-small-btn:hover {
        background: #d35400;
      }
      .delete-small-btn {
        background: var(--danger);
      }
      .delete-small-btn:hover {
        background: #c0392b;
      }

      /* Settlement summary — card list */
      .member-summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 18px;
      }
      .member-stat-card {
        background: #f7fafc;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }
      .member-stat-name {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .member-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #bee3f8;
        color: #2b6cb0;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 3px;
      }
      .stat-row .label {
        color: var(--muted);
      }
      .stat-row .val {
        font-weight: 600;
      }
      .balance-badge {
        display: inline-block;
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 700;
        margin-top: 6px;
      }
      .balance-positive {
        background: #c6f6d5;
        color: #276749;
      }
      .balance-negative {
        background: #fed7d7;
        color: #9b2c2c;
      }
      .balance-zero {
        background: #e2e8f0;
        color: #4a5568;
      }

      .transfer-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .transfer-item {
        background: #fff0f0;
        border-left: 4px solid var(--danger);
        border-radius: 0 8px 8px 0;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .transfer-item .names {
        font-size: 14px;
      }
      .transfer-item .names strong {
        color: var(--text);
      }
      .transfer-item .arrow {
        color: var(--muted);
        font-size: 13px;
        margin: 0 4px;
      }
      .transfer-amount {
        font-weight: 700;
        font-size: 16px;
        color: var(--danger);
      }
      .section-label {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .no-data {
        text-align: center;
        color: var(--muted);
        padding: 24px;
        font-style: italic;
      }

      @media (max-width: 380px) {
        .radio-group {
          flex-direction: column;
        }
        .filter-grid {
          grid-template-columns: 1fr;
        }
        .member-summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <h2 id="form-title">新增消費項目</h2>
      </div>

      <div class="form-group">
        <label for="expense-date">日期</label>
        <input type="date" id="expense-date" />
      </div>
      <div class="form-group">
        <label for="expense-item">消費項目</label>
        <input
          type="text"
          id="expense-item"
          placeholder="例如：晚餐、車資、住宿..."
        />
      </div>
      <div class="form-group">
        <label>付款人</label>
        <input type="hidden" id="payer" value="大仙" />
        <div class="btn-group" id="payerGroup">
          <button
            type="button"
            class="btn-toggle active"
            onclick="selectPayer('大仙')"
          >
            大仙
          </button>
          <button
            type="button"
            class="btn-toggle"
            onclick="selectPayer('冠宇')"
          >
            冠宇
          </button>
          <button
            type="button"
            class="btn-toggle"
            onclick="selectPayer('書晴')"
          >
            書晴
          </button>
          <button
            type="button"
            class="btn-toggle"
            onclick="selectPayer('瑄瑄')"
          >
            瑄瑄
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>分攤方式</label>
        <div class="radio-group">
          <div class="radio-box">
            <input
              type="radio"
              id="type-custom"
              name="split-type"
              value="個別自訂"
              checked
            />
            <label for="type-custom">個別自訂</label>
          </div>
          <div class="radio-box">
            <input
              type="radio"
              id="type-all"
              name="split-type"
              value="全員均分"
            />
            <label for="type-all">全員均分</label>
          </div>
          <div class="radio-box">
            <input
              type="radio"
              id="type-select"
              name="split-type"
              value="指定人均分"
            />
            <label for="type-select">指定人均分</label>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="total-amount">總金額</label>
        <input
          type="number"
          id="total-amount"
          placeholder="請輸入總金額"
          min="0"
        />
      </div>
      <div class="form-group">
        <label id="section-title">分攤明細</label>
        <div class="members-section" id="members-container"></div>
      </div>
      <div class="form-group">
        <label for="expense-note">備註</label>
        <input type="text" id="expense-note" placeholder="可選填..." />
      </div>
      <input type="hidden" id="editing-id" value="" />
      <button class="submit-btn" id="submit-btn" onclick="submitForm()">
        儲存記帳
      </button>
      <button
        class="cancel-btn"
        id="cancel-btn"
        onclick="resetForm()"
        style="display: none"
      >
        取消編輯
      </button>
    </div>

    <div class="card card-accent-warning">
      <div class="card-header">
        <h3>篩選時間區間</h3>
      </div>
      <div class="filter-grid">
        <div class="form-group" style="margin-bottom: 0">
          <label for="filter-start">開始日期</label>
          <input
            type="date"
            id="filter-start"
            onchange="filterAndRecalculate()"
          />
        </div>
        <div class="form-group" style="margin-bottom: 0">
          <label for="filter-end">結束日期</label>
          <input
            type="date"
            id="filter-end"
            onchange="filterAndRecalculate()"
          />
        </div>
      </div>
    </div>

    <div class="card card-accent-success">
      <div class="card-header">
        <h3>債權結算結果</h3>
      </div>
      <div class="section-label">各成員總覽</div>
      <div class="member-summary-grid" id="settlement-matrix-body"></div>
      <div class="section-label">清償方案</div>
      <div id="summary-results-container"></div>
    </div>

    <div class="card" id="expense-details-card">
      <div
        class="card-header"
        onclick="toggleCollapse('expenses-collapse-content')"
        style="
          cursor: pointer;
          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 100%;
        "
      >
        <h3>消費明細</h3>
        <span
          id="collapse-arrow"
          style="
            font-size: 14px;
            color: var(--muted);
            transition: transform 0.2s;
          "
          >▼</span
        >
      </div>
      <div id="expenses-collapse-content">
        <div class="form-group" style="margin-top: 4px; margin-bottom: 14px">
          <label style="margin-bottom: 6px">篩選付款人：</label>
          <input type="hidden" id="filter-payer" value="全部" />
          <div class="btn-group" id="filterPayerGroup">
            <button
              type="button"
              class="btn-toggle-filter active"
              onclick="selectFilterPayer('全部')"
            >
              全部成員
            </button>
            <button
              type="button"
              class="btn-toggle-filter"
              onclick="selectFilterPayer('大仙')"
            >
              大仙
            </button>
            <button
              type="button"
              class="btn-toggle-filter"
              onclick="selectFilterPayer('冠宇')"
            >
              冠宇
            </button>
            <button
              type="button"
              class="btn-toggle-filter"
              onclick="selectFilterPayer('書晴')"
            >
              書晴
            </button>
            <button
              type="button"
              class="btn-toggle-filter"
              onclick="selectFilterPayer('瑄瑄')"
            >
              瑄瑄
            </button>
          </div>
        </div>

        <div
          class="form-group"
          style="
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
          "
        >
          <label
            style="
              margin-bottom: 0;
              white-space: nowrap;
              font-size: 13px;
              color: var(--muted);
            "
            >顯示筆數：</label
          >
          <div style="display: flex; gap: 6px">
            <button
              type="button"
              class="btn-toggle-limit active"
              onclick="changeDisplayLimit(5)"
            >
              5筆
            </button>
            <button
              type="button"
              class="btn-toggle-limit"
              onclick="changeDisplayLimit(10)"
            >
              10筆
            </button>
            <button
              type="button"
              class="btn-toggle-limit"
              onclick="changeDisplayLimit(20)"
            >
              20筆
            </button>
            <button
              type="button"
              class="btn-toggle-limit"
              onclick="changeDisplayLimit(-1)"
            >
              全部
            </button>
          </div>
        </div>

        <div id="expenses-list-container">
          <div class="no-data">載入中...</div>
        </div>
      </div>
    </div>

    <script>
      const GAS_WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbxZcwMvCxB-bd_FPeaT9B7kkms1o1ARjNrTYacg9yWGFOEs08dQlZAF-peAdDg6D_1N/exec";
      const members = ["大仙", "冠宇", "書晴", "瑄瑄"];
      let expensesData = [];
      let currentDisplayLimit = 5; // 預設顯示 5 筆資料

      document.addEventListener("DOMContentLoaded", function () {
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("expense-date").value = today;
        const ym = today.substring(0, 7);
        document.getElementById("filter-start").value = `${ym}-01`;
        document.getElementById("filter-end").value = today;
        renderFormMembers();
        document
          .getElementById("total-amount")
          .addEventListener("input", calculateFormSplits);
        document
          .querySelectorAll('input[name="split-type"]')
          .forEach((r) => r.addEventListener("change", handleFormTypeChange));
        handleFormTypeChange();
        fetchHistoryData();
      });

      function fetchHistoryData() {
        document.getElementById("expenses-list-container").innerHTML =
          '<div class="no-data">同步雲端資料中...</div>';
        fetch(`${GAS_WEB_APP_URL}?action=read`)
          .then((r) => r.json())
          .then((data) => {
            expensesData = data || [];
            filterAndRecalculate();
          })
          .catch(() => {
            document.getElementById("expenses-list-container").innerHTML =
              '<div class="no-data" style="color:var(--danger)">歷史資料讀取失敗，請確認 Apps Script 設定。</div>';
          });
      }

      function toggleCollapse(id) {
        const el = document.getElementById(id);
        const arrow = document.getElementById("collapse-arrow");
        if (el.style.display === "none") {
          el.style.display = "block";
          arrow.textContent = "▼";
        } else {
          el.style.display = "none";
          arrow.textContent = "▲";
        }
      }

      // 安全且即時解析四則運算表達式的函數
      function evaluateMath(str) {
        let cleaned = str.replace(/[^0-9+\-*/.()]/g, "");
        if (!cleaned) return 0;
        try {
          let res = new Function(`return ${cleaned}`)();
          return typeof res === "number" && isFinite(res) ? res : 0;
        } catch (e) {
          try {
            // 若輸入中途結尾是運算子(如 "100+")，自動剔除結尾並動態計算前段，提升輸入流暢感
            let trimmed = cleaned.replace(/[+\-*/.]+$/, "");
            if (!trimmed) return 0;
            let res = new Function(`return ${trimmed}`)();
            return typeof res === "number" && isFinite(res) ? res : 0;
          } catch (err) {
            return 0;
          }
        }
      }

      function renderFormMembers() {
        const c = document.getElementById("members-container");
        c.innerHTML = "";
        members.forEach((name) => {
          const row = document.createElement("div");
          row.className = "member-row";
          row.innerHTML = `
            <label class="member-label">
              <input type="checkbox" class="member-calc-check" value="${name}" onchange="handleCheckboxClick(this)">
              <span>${name}</span>
            </label>
            <div class="amount-right">
              <span class="result-amount" id="result-${name}">0</span>
              <input type="text" class="custom-amount-input" id="input-${name}" placeholder="0" style="display:none" oninput="sumCustomAmounts()">
              <span style="font-size:13px;color:var(--muted)">元</span>
            </div>`;
          c.appendChild(row);
        });
      }

      function handleCheckboxClick(cb) {
        const type = document.querySelector(
          'input[name="split-type"]:checked',
        ).value;
        if (type === "個別自訂") {
          const inp = document.getElementById(`input-${cb.value}`);
          inp.disabled = !cb.checked;
          if (!cb.checked) inp.value = "";
          sumCustomAmounts();
        } else {
          calculateFormSplits();
        }
      }

      function handleFormTypeChange() {
        const type = document.querySelector(
          'input[name="split-type"]:checked',
        ).value;
        const ta = document.getElementById("total-amount");
        const checks = document.querySelectorAll(".member-calc-check");
        const results = document.querySelectorAll(".result-amount");
        const customs = document.querySelectorAll(".custom-amount-input");
        const title = document.getElementById("section-title");

        if (type === "全員均分") {
          title.textContent = "分攤明細 (全員均分)";
          ta.disabled = false;
          checks.forEach((c) => {
            c.checked = true;
            c.disabled = true;
          });
          customs.forEach((i) => (i.style.display = "none"));
          results.forEach((s) => (s.style.display = "inline"));
          calculateFormSplits();
        } else if (type === "指定人均分") {
          title.textContent = "選擇分攤成員 (均分)";
          ta.disabled = false;
          checks.forEach((c) => {
            c.checked = false;
            c.disabled = false;
          });
          customs.forEach((i) => (i.style.display = "none"));
          results.forEach((s) => (s.style.display = "inline"));
          calculateFormSplits();
        } else {
          title.textContent = "個別自訂金額 (支援 + - * / 算式)";
          ta.disabled = true;
          ta.value = "";
          checks.forEach((c) => {
            c.checked = false;
            c.disabled = false;
          });
          results.forEach((s) => (s.style.display = "none"));
          customs.forEach((i) => {
            i.style.display = "inline-block";
            i.value = "";
            i.disabled = true;
          });
        }
      }

      function calculateFormSplits() {
        if (
          document.querySelector('input[name="split-type"]:checked').value ===
          "個別自訂"
        )
          return;
        const total =
          parseFloat(document.getElementById("total-amount").value) || 0;
        const checked = document.querySelectorAll(".member-calc-check:checked");
        const each =
          checked.length > 0 ? (total / checked.length).toFixed(2) : 0;
        members.forEach(
          (n) => (document.getElementById(`result-${n}`).textContent = "0"),
        );
        checked.forEach(
          (c) =>
            (document.getElementById(`result-${c.value}`).textContent =
              parseFloat(each).toString()),
        );
      }

      function sumCustomAmounts() {
        let total = 0;
        members.forEach((name) => {
          const cb = Array.from(
            document.querySelectorAll(".member-calc-check"),
          ).find((c) => c.value === name);
          const inp = document.getElementById(`input-${name}`);
          if (cb && cb.checked && inp.value) total += evaluateMath(inp.value);
        });
        document.getElementById("total-amount").value = total;
      }

      function resetForm() {
        document.getElementById("editing-id").value = "";
        document.getElementById("expense-item").value = "";
        document.getElementById("total-amount").value = "";
        document.getElementById("expense-note").value = "";
        document.getElementById("form-title").textContent = "新增消費項目";
        document.getElementById("submit-btn").textContent = "儲存記帳";
        document.getElementById("cancel-btn").style.display = "none";
        document.getElementById("expense-date").value = new Date()
          .toISOString()
          .split("T")[0];
        document.getElementById("type-custom").checked = true;
        selectPayer("大仙");
        handleFormTypeChange();
      }

      function startEdit(id) {
        const item = expensesData.find(
          (e) =>
            e.id == id ||
            (e.id === undefined && new Date(e.date).getTime() == id),
        );
        if (!item) {
          alert("找不到該筆資料！");
          return;
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
        document.getElementById("editing-id").value = id;
        document.getElementById("form-title").textContent = "修改消費項目";
        document.getElementById("submit-btn").textContent = "更新記帳";
        document.getElementById("cancel-btn").style.display = "block";
        document.getElementById("expense-date").value = item.date;
        document.getElementById("expense-item").value = item.item;
        document.getElementById("expense-note").value = item.note || "";
        selectPayer(item.payer);
        if (item.type === "全員均分")
          document.getElementById("type-all").checked = true;
        else if (item.type === "指定人均分")
          document.getElementById("type-select").checked = true;
        else document.getElementById("type-custom").checked = true;
        handleFormTypeChange();
        members.forEach((name) => {
          const cb = Array.from(
            document.querySelectorAll(".member-calc-check"),
          ).find((c) => c.value === name);
          const amount = item.shares[name] || 0;
          if (item.type === "個別自訂") {
            const inp = document.getElementById(`input-${name}`);
            cb.checked = amount > 0;
            inp.disabled = !cb.checked;
            inp.value = amount > 0 ? amount : "";
          } else {
            cb.checked = amount > 0;
          }
        });
        document.getElementById("total-amount").value = item.total;
        if (item.type !== "個別自訂") calculateFormSplits();
      }

      function deleteItem(id) {
        if (
          !confirm(
            "確定要刪除這筆記帳紀錄？此動作將同步移除雲端試算表上的資料且無法復原。",
          )
        )
          return;
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.textContent = "雲端刪除中...";
        fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "delete", id }),
        })
          .then(() => {
            expensesData = expensesData.filter((e) => e.id != id);
            filterAndRecalculate();
            alert("資料已成功刪除！");
          })
          .catch(() => alert("刪除失敗，請檢查網路連線！"))
          .finally(() => {
            btn.disabled = false;
            resetForm();
          });
      }

      function submitForm() {
        const editingId = document.getElementById("editing-id").value;
        const date = document.getElementById("expense-date").value;
        const item = document.getElementById("expense-item").value;
        const payer = document.getElementById("payer").value;
        const type = document.querySelector(
          'input[name="split-type"]:checked',
        ).value;
        const total =
          parseFloat(document.getElementById("total-amount").value) || 0;
        const note = document.getElementById("expense-note").value;
        if (!item) {
          alert("請填寫消費項目！");
          return;
        }
        if (total <= 0) {
          alert("總金額必須大於 0！");
          return;
        }
        let shares = {};
        members.forEach((name) => {
          const cb = Array.from(
            document.querySelectorAll(".member-calc-check"),
          ).find((c) => c.value === name);
          if (type === "個別自訂") {
            const inp = document.getElementById(`input-${name}`);
            shares[name] =
              cb && cb.checked && inp.value ? evaluateMath(inp.value) : 0;
          } else {
            shares[name] =
              cb && cb.checked
                ? parseFloat(
                    document.getElementById(`result-${name}`).textContent,
                  )
                : 0;
          }
        });
        const finalId = editingId || "ID_" + Date.now();
        const action = editingId ? "update" : "create";
        const postData = {
          action,
          id: finalId,
          date,
          item,
          payer,
          total,
          type,
          shares,
          note,
        };
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.textContent = editingId ? "更新中..." : "寫入中...";
        fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(postData),
        })
          .then(() => {
            const record = {
              id: finalId,
              date,
              item,
              payer,
              total,
              type,
              shares,
              note,
            };
            if (editingId) {
              const i = expensesData.findIndex((e) => e.id == editingId);
              if (i !== -1) expensesData[i] = record;
            } else expensesData.push(record);
            resetForm();
            filterAndRecalculate();
            alert(
              editingId ? "資料已成功更新！" : "記帳成功！資料已寫入試算表。",
            );
          })
          .catch(() => alert("操作失敗，請檢查網路連線或 Apps Script 設定！"))
          .finally(() => {
            btn.disabled = false;
          });
      }

      // 需求 2 控制：處理明細付款人按鈕切換邏輯
      function selectFilterPayer(name) {
        document.getElementById("filter-payer").value = name;
        document
          .querySelectorAll("#filterPayerGroup .btn-toggle-filter")
          .forEach((btn) => {
            btn.classList.toggle(
              "active",
              btn.textContent.trim() === (name === "全部" ? "全部成員" : name),
            );
          });
        filterAndRecalculate();
      }

      // 需求 1 控制：切換顯示限制筆數的處理函式
      function changeDisplayLimit(limit) {
        currentDisplayLimit = limit;
        document.querySelectorAll(".btn-toggle-limit").forEach((btn) => {
          const text = btn.textContent.trim();
          if (limit === -1 && text === "全部") btn.classList.add("active");
          else if (limit !== -1 && text === `${limit}筆`)
            btn.classList.add("active");
          else btn.classList.remove("active");
        });
        filterAndRecalculate();
      }

      function filterAndRecalculate() {
        const start = document.getElementById("filter-start").value;
        const end = document.getElementById("filter-end").value;
        const payerFilter = document.getElementById("filter-payer")
          ? document.getElementById("filter-payer").value
          : "全部";

        // 1. 根據日期區間，計算大局下的債權結算
        const filteredForSettlement = expensesData.filter((e) => {
          if (start && e.date < start) return false;
          if (end && e.date > end) return false;
          return true;
        });
        calculateSettlementSummary(filteredForSettlement);

        // 2. 根據日期與付款人按鈕狀態，篩選要展現的消費明細資料
        const filteredForCards = filteredForSettlement.filter((e) => {
          if (payerFilter !== "全部" && e.payer !== payerFilter) return false;
          return true;
        });
        filteredForCards.sort((a, b) => b.date.localeCompare(a.date));

        // 需求 1 限制：根據選擇的顯示筆數裁切陣列
        let finalDisplayData = filteredForCards;
        if (currentDisplayLimit > 0) {
          finalDisplayData = filteredForCards.slice(0, currentDisplayLimit);
        }

        renderExpenseCards(finalDisplayData, filteredForCards.length);
      }

      function renderExpenseCards(data, totalCount) {
        const container = document.getElementById("expenses-list-container");
        if (data.length === 0) {
          container.innerHTML =
            '<div class="no-data">此時間區間與篩選條件內暫無記帳明細</div>';
          return;
        }
        const cards = document.createElement("div");
        cards.className = "expense-cards";
        data.forEach((exp) => {
          const targetId = exp.id || "ID_" + new Date(exp.date).getTime();
          const shareTags = Object.entries(exp.shares)
            .filter(([, v]) => v > 0)
            .map(([n, v]) => `<span class="share-tag">${n} ${v}元</span>`)
            .join("");
          const card = document.createElement("div");
          card.className = "expense-card";
          card.innerHTML = `
            <div class="expense-card-top">
              <span class="expense-card-title">${exp.item}</span>
              <span class="expense-card-type">${exp.type}</span>
            </div>
            <div class="expense-card-meta">
              <span>${exp.date}</span>
              <span class="payer">由 ${exp.payer} 付款</span>
              ${exp.note ? `<span style="color:var(--muted)">${exp.note}</span>` : ""}
            </div>
            <div class="expense-card-amount">${exp.total} 元</div>
            <div class="expense-card-shares">${shareTags}</div>
            <div class="expense-card-actions">
              <button class="action-btn edit-small-btn" onclick="startEdit('${targetId}')">編輯</button>
              <button class="action-btn delete-small-btn" onclick="deleteItem('${targetId}')">刪除</button>
            </div>`;
          cards.appendChild(card);
        });

        // 提示字樣：告知當前顯示的比例 (例如：顯示 5 筆 / 共 14 筆)
        const countIndicator = document.createElement("div");
        countIndicator.style.cssText =
          "font-size: 12px; color: var(--muted); text-align: right; margin-top: 8px; padding-right: 4px;";
        countIndicator.textContent = `目前顯示 ${data.length} 筆 / 共 ${totalCount} 筆符合條件之明細`;

        container.innerHTML = "";
        container.appendChild(cards);
        container.appendChild(countIndicator);
      }

      function calculateSettlementSummary(data) {
        let s = {};
        members.forEach((m) => (s[m] = { paid: 0, owe: 0 }));
        data.forEach((exp) => {
          if (s[exp.payer]) s[exp.payer].paid += exp.total;
          for (let name in exp.shares)
            if (s[name]) s[name].owe += exp.shares[name];
        });

        const grid = document.getElementById("settlement-matrix-body");
        grid.innerHTML = "";
        members.forEach((name) => {
          const p = s[name].paid,
            o = s[name].owe,
            b = p - o;
          const bClass =
            b > 0.05
              ? "balance-positive"
              : b < -0.05
                ? "balance-negative"
                : "balance-zero";
          const bText =
            b > 0.05
              ? `+${b.toFixed(1)} 應收`
              : b < -0.05
                ? `${b.toFixed(1)} 應付`
                : "0 已平帳";
          const initials = name.charAt(0);
          const card = document.createElement("div");
          card.className = "member-stat-card";
          card.innerHTML = `
            <div class="member-stat-name">
              <div class="member-avatar">${initials}</div>
              ${name}
            </div>
            <div class="stat-row"><span class="label">代墊金額</span><span class="val">${p.toFixed(1)} 元</span></div>
            <div class="stat-row"><span class="label">應分攤</span><span class="val">${o.toFixed(1)} 元</span></div>
            <span class="balance-badge ${bClass}">${bText}</span>`;
          grid.appendChild(card);
        });

        let creditors = [],
          debtors = [];
        for (let n in s) {
          const b = Math.round((s[n].paid - s[n].owe) * 100) / 100;
          if (b > 0.05) creditors.push({ name: n, amount: b });
          else if (b < -0.05) debtors.push({ name: n, amount: Math.abs(b) });
        }

        const rc = document.getElementById("summary-results-container");
        if (!creditors.length && !debtors.length) {
          rc.innerHTML =
            '<div class="no-data">所有帳目均已平帳，無須轉移債權。</div>';
          return;
        }
        const list = document.createElement("div");
        list.className = "transfer-list";
        let ci = 0,
          di = 0;
        while (ci < creditors.length && di < debtors.length) {
          const cr = creditors[ci],
            db = debtors[di];
          const t = Math.min(cr.amount, db.amount);
          if (t > 0.01) {
            const item = document.createElement("div");
            item.className = "transfer-item";
            item.innerHTML = `
              <div class="names">
                <strong>${db.name}</strong>
                <span class="arrow">→</span>
                <strong>${cr.name}</strong>
              </div>
              <span class="transfer-amount">${t.toFixed(1)} 元</span>`;
            list.appendChild(item);
          }
          cr.amount -= t;
          db.amount -= t;
          if (cr.amount <= 0.05) ci++;
          if (db.amount <= 0.05) di++;
        }
        rc.innerHTML = "";
        rc.appendChild(list);
      }

      function selectPayer(name) {
        document.getElementById("payer").value = name;
        document.querySelectorAll("#payerGroup .btn-toggle").forEach((btn) => {
          btn.classList.toggle("active", btn.textContent.trim() === name);
        });
      }
    </script>
  </body>
</html>
